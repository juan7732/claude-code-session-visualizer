name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# The workflow reads the repository and nothing else. Actions are pinned to a
# commit: a tag can be moved to other code, a commit cannot.
permissions:
  contents: read
jobs:
  check:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./test/...
      - name: Lint (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./... && staticcheck -tags=integration ./test/...
      - name: Known vulnerabilities (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Format check (prettier)
        run: npm ci --silent && npx prettier --check .
      - name: Test with race detector
        run: go test -race ./...
      - name: Build (darwin/arm64, darwin/amd64, linux/amd64, linux/arm64)
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=ci" -o "bin/skit-$os-$arch" ./cmd/skit
          done
  client:
    name: Client (Swift, macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: Scripts/swiftpm.sh build
        working-directory: client/SessionVisualizer
      - name: Contract and unit tests against the engine in this commit
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          client/SessionVisualizer/Scripts/record-fixtures.sh "$dir"
          cd client/SessionVisualizer && SKIT_FIXTURES="$dir" Scripts/swiftpm.sh test
  integration:
    name: Integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # no build record kept as an artifact of the run
        with:
          context: .
          file: test/integration/Dockerfile
          tags: skit-integration:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run integration tests
        run: docker run --rm -v "$PWD":/src skit-integration:ci
