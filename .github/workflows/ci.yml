name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./test/...
      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Format check (prettier)
        run: npm ci --silent && npx prettier --check .
      - name: Test with race detector
        run: go test -race ./...
      - name: Build (darwin/arm64, darwin/amd64, linux/amd64, linux/arm64)
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -ldflags "-X main.version=ci" -o "bin/skit-$os-$arch" ./cmd/skit
          done
  integration:
    name: Integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: test/integration/Dockerfile
          tags: skit-integration:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run integration tests
        run: docker run --rm -v "$PWD":/src skit-integration:ci
